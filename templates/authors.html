{% extends 'base.html' %}

{% block title %}作者管理{% endblock %}

{% block page_title %}作者管理{% endblock %}

{% block content %}
    <h2>添加作者</h2>
    <form method="post">
        <input type="text" name="name" placeholder="作者名字" required>
        <button type="submit">添加</button>
    </form>

    <h2>作者列表</h2>
    <ul>
        {% for author in authors %}
            <li>{{ author.name }}（{{ author.articles|length }} 篇文章）</li>
            <form method="post" action="{{ url_for('delete_author', author_id=author.id) }}" style="display:inline;">
                <button type="submit" onclick="return confirm('确认删除作者{{ author.name }}？')" style="color:red;">删</button>
            </form>
        {% endfor %}
    </ul>
{% endblock %}
